<script>
/* Shared XP rules. CEFR is a learning preference, never an XP rank. */
(function(root){
  function rank(points){const xp=Math.max(0,Math.floor(Number(points)||0));const level=Math.floor((1+Math.sqrt(1+xp/12.5))/2);const start=50*level*(level-1),next=50*level*(level+1);return {xp,level,start,next,remaining:next-xp,percent:Math.floor(100*(xp-start)/(next-start))};}
  function rewardKey(e){const p=e.payload,day=new Date(e.at).toISOString().slice(0,10);if(e.kind==='answer'&&p.ok&&!p.hint)return 'answer:'+day+':'+(p.cefr||'B2')+':'+p.item;if(e.kind==='essay'&&p.entry){if(p.entry.revised.trim().split(/\s+/).length>=10)return 'revision:'+p.entry.id;if(p.entry.first.trim().split(/\s+/).length>=10)return 'essay:'+p.entry.id;}if(e.kind==='exam'&&p.score>0)return 'exam:'+p.id;if(e.kind==='activity'&&p.type==='speaking'&&p.seconds>=30)return 'speaking:'+day;return null;}
  function reward(events,event){const key=rewardKey(event);if(!key||events.some(e=>rewardKey(e)===key))return 0;return event.kind==='answer'?(event.payload.mode==='review'?15:10):event.kind==='essay'?key.startsWith('revision:')?30:20:event.kind==='exam'?30:15;}
  const api={rank,reward,rewardKey,levels:['A1','A2','B1','B2']};root.BukiLevels=api;if(typeof module==='object'&&module.exports)module.exports=api;
})(typeof window==='object'?window:globalThis);

/* Pure course analytics: no network, no paid services. */
(function(root){
const settings=new Set(['cefr_preference','cosmetic','placement','resume','preferences','report_request','story_progress']);
function study(e){return e.kind!=='reward'&&!(e.kind==='activity'&&settings.has(e.payload.type));}
function select(items,events,n,id,now=Date.now()){
 const history=new Map();for(const e of events)if(e.kind==='answer')history.set(e.payload.item,e);
 return items.map((x,i)=>{const e=history.get(id(x));return {x,i,priority:!e?0:!e.payload.ok&&now-e.at>864e5?-1:1,last:e?.at||0};}).sort((a,b)=>a.priority-b.priority||a.last-b.last||a.i-b.i).slice(0,n).map(x=>x.x);
}
function units(events,bank){return bank.units.map(u=>{const results=events.filter(e=>e.kind==='activity'&&e.payload.type==='unit_result'&&e.payload.unit===u.id);return {...u,passed:results.some(e=>e.payload.score/e.payload.total>=.8),best:Math.max(0,...results.map(e=>Math.round(e.payload.score/e.payload.total*100))),attempts:results.length};});}
function recommendation(results){let recommended='A1';for(const l of ['A1','A2','B1','B2']){if(results.filter(x=>x.level===l&&x.ok).length<3)break;recommended=({A1:'A2',A2:'B1',B1:'B2',B2:'B2'})[l];}return recommended;}
function gaps(events){const groups=new Map();for(const e of events){if(e.kind!=='answer')continue;const p=e.payload,k=p.skill||p.topic;const row=groups.get(k)||{id:k,n:0,wrong:0,streak:0,items:new Set()};row.n++;row.items.add(p.item);if(p.ok&&!p.hint)row.streak++;else{row.wrong++;row.streak=0;}groups.set(k,row);}return [...groups.values()].filter(r=>r.wrong).map(r=>({...r,items:[...r.items],resolved:r.streak>=3})).sort((a,b)=>a.resolved-b.resolved||b.wrong-a.wrong);}
function report(events,now,day){const dates=Array.from({length:28},(_,i)=>day(now-(27-i)*864e5));const week=new Set(dates.slice(-7)),active=events.filter(study),recent=active.filter(e=>week.has(day(e.at))),answers=recent.filter(e=>e.kind==='answer'),ok=answers.filter(e=>e.payload.ok&&!e.payload.hint);return {days:dates.map(date=>({date,n:active.filter(e=>day(e.at)===date).length})),activeDays:new Set(recent.map(e=>day(e.at))).size,answers:answers.length,accuracy:answers.length?Math.round(ok.length/answers.length*100):null,words:new Set(ok.filter(e=>e.payload.item.startsWith('vocab:')).map(e=>e.payload.item)).size,reviews:ok.filter(e=>e.payload.mode==='review').length,essays:new Set(recent.filter(e=>e.kind==='essay').map(e=>e.payload.entry.id)).size,units:new Set(recent.filter(e=>e.payload.type==='unit_result'&&e.payload.score/e.payload.total>=.8).map(e=>e.payload.unit)).size};}
const api={study,select,units,recommendation,gaps,report};root.BukiLearning=api;if(typeof module==='object'&&module.exports)module.exports=api;
})(typeof window==='object'?window:globalThis);

(function(root){
const DAY=864e5;
function lastResume(events,level){return [...events].reverse().find(e=>e.kind==='activity'&&e.payload.type==='resume'&&e.payload.cefr===level)?.payload||null;}
function retention(events,words,now=Date.now()){return words.filter(w=>w.retention).map(w=>{const rows=events.filter(e=>e.kind==='answer'&&e.payload.item==='vocab:'+w.w);const first=rows.find(e=>e.payload.ok&&!e.payload.hint);if(!first)return {w,status:'new',due:null};const checks=rows.filter(e=>e.payload.mode==='retention');const last=checks.at(-1),successful=checks.filter(e=>e.payload.ok&&!e.payload.hint&&e.at-first.at>=3*DAY);const due=last?last.at+(last.payload.ok&&!last.payload.hint?7:1)*DAY:first.at+3*DAY;return {w,first:first.at,last:last?.at,due,status:successful.length?'retained':now>=due?'due':'waiting'};});}
function preferences(events){const p=[...events].reverse().find(e=>e.kind==='activity'&&e.payload.type==='preferences')?.payload||{};return {font:[100,115,130].includes(p.font)?p.font:100,motion:['full','gentle','off'].includes(p.motion)?p.motion:'gentle',sound:p.sound===true,focus:p.focus===true};}
function sentenceModel(w){const chunks=w.s.replace(/[\[\]]/g,'').match(/[^.!?]+[.!?]?/g);return chunks?.[0]?.trim()||w.w;}
function weekStart(now){const date=new Date(now+3*3600e3);const day=(date.getUTCDay()+6)%7;date.setUTCDate(date.getUTCDate()-day);return date.toISOString().slice(0,10);}
const api={lastResume,retention,preferences,sentenceModel,weekStart};root.BukiJourney=api;if(typeof module==='object'&&module.exports)module.exports=api;
})(typeof window==='object'?window:globalThis);


/* Buki learning engine: deterministic, idempotent event replay. */
(function(root){
'use strict';
const DAY=86400000,intervals=[1,3,7,14,30];
function valid(e){if(!e||typeof e.id!=='string'||!Number.isFinite(e.at)||!e.payload||typeof e.payload!=='object'||Array.isArray(e.payload))return false;const p=e.payload;switch(e.kind){case 'answer':return typeof p.item==='string'&&typeof p.topic==='string'&&typeof p.ok==='boolean';case 'essay':return p.entry&&typeof p.entry.id==='string'&&typeof p.entry.first==='string'&&typeof p.entry.revised==='string'&&typeof p.entry.topic==='string'&&typeof p.entry.feedback==='string';case 'known':case 'save_word':return typeof p.word==='string';case 'import':return (!p.known||Array.isArray(p.known))&&(!p.review||typeof p.review==='object'&&!Array.isArray(p.review));case 'exam':return Number.isFinite(p.score)&&Number.isFinite(p.total)&&p.total>0;case 'activity':return typeof p.type==='string';case 'reward':return Number.isFinite(p.avatar);default:return false}}

function derive(events,now=Date.now()){
const s={review:{},topics:{},answers:[],essays:{},saved:{},days:{},known:new Set(),best:0,writingCount:0,writingBest:0,exams:[],completedReviews:0,legacyReviews:{}};
for(const e of merge(events)){
const p=e.payload;
if(e.kind==='import'){for(const w of p.known||[])if(typeof w==='string')s.known.add(w);s.best=Math.max(s.best,+p.best||0);s.writingCount=Math.max(s.writingCount,+p.wc||0);s.writingBest=Math.max(s.writingBest,+p.wb||0);Object.assign(s.legacyReviews,p.review||{});continue}
if(e.kind==='answer'){
if(typeof p.item!=='string'||typeof p.topic!=='string')continue;
const arr=s.topics[p.topic]||(s.topics[p.topic]=[]);arr.push({ok:!!p.ok,hint:!!p.hint,at:e.at});if(arr.length>50)arr.shift();s.answers.push(e);const dt=day(e.at);(s.days[dt]||(s.days[dt]=[])).push(e);
if(p.ok&&p.word)s.known.add(p.word);
let r=s.review[p.item];if(r||!p.ok||p.topic==='collocation'||s.legacyReviews[p.item]){r=r||{streak:0,errors:0,...s.legacyReviews[p.item]};r.streak=p.ok&&!p.hint?(r.streak||0)+1:0;r.errors=(r.errors||0)+(p.ok?0:1);r.due=e.at+(r.streak?intervals[Math.min(r.streak-1,4)]*DAY:0);r.topic=p.topic;r.last=e.at;s.review[p.item]=r;if(p.mode==='review'&&p.ok&&!p.hint)s.completedReviews++}
}else if(e.kind==='known'&&p.word){s.known.add(p.word);const dt=day(e.at);(s.days[dt]||(s.days[dt]=[])).push(e);}
else if(e.kind==='essay'&&p.entry&&typeof p.entry.id==='string'){const old=s.essays[p.entry.id];if(!old||(+p.entry.updated||0)>=(+old.updated||0))s.essays[p.entry.id]=p.entry;const dt=day(e.at);(s.days[dt]||(s.days[dt]=[])).push(e);if(Number.isFinite(p.entry.score))s.writingBest=Math.max(s.writingBest,p.entry.score)}
else if(e.kind==='save_word'&&p.word)s.saved[p.word]=p.active!==false;
else if(e.kind==='exam'){s.exams.push({...p,at:e.at});s.best=Math.max(s.best,+p.percent||0)}
else if(e.kind==='activity'){const dt=day(e.at);(s.days[dt]||(s.days[dt]=[])).push(e)}
}
for(const [id,r] of Object.entries(s.legacyReviews))if(!s.review[id])s.review[id]=r;
s.due=Object.entries(s.review).filter(([,r])=>r.due<=now).map(([id])=>id);

}
function normalize(text){return String(text).normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[^\p{L}\p{N}'\s]/gu,' ').replace(/\s+/g,' ').trim()}

const API={day,merge,derive,normalize,stats,valid};root.BukiCore=API;if(typeof module==='object'&&module.exports)module.exports=API;
})(typeof window==='object'?window:globalThis);

{n:'💬 Reported Speech',r:`<p><b>Backshift</b>: present simple → past simple, present perfect → past perfect, will → would, can → could, must → had to.</p><p><b>Zaman/yer</b>: now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there.</p><p><b>Sorular</b>: if/whether + düz cümle sırası (do/does yok): <i>He asked where I lived.</i></p><p><b>tell + kişi</b>, say + (to) kişi. Fiiller: suggest + V-ing, promise/offer to + V1, advise/ask sb to + V1, deny/admit + V-ing.</p>`,q:`She said, 'I am tired.' → She said that she ___ tired.|is|was|had been|will be|1|Backshift: am → was.

'Use Past Simple for a finished time: yesterday, ago, last week. Use have/has + past participle for experience or a present result. Use since for a starting point and for for a duration. Past Perfect (had + past participle) marks the earlier of two past events. Perfect Continuous focuses on duration.',
'Zero: if + present, present. First: if + present, will + verb. Second: if + past, would + verb. Third: if + had + past participle, would have + past participle. A mixed conditional connects a past condition to a present result. Unless means if not.',
'The passive uses be + past participle. Change be to match the tense: is done, was done, has been done, will be done. Use by for the agent. Intransitive verbs such as happen and arrive cannot be passive.',
'In reported speech, past reporting verbs often move the tense back: is → was; has done → had done; will → would. Tell needs a person; say does not. Indirect questions use statement word order without do or did.',
'Use who for people, which for things, whose for possession and where for places. Defining clauses identify the noun. Non-defining clauses add information with commas; do not use that or omit the relative pronoun in them.',

'Enjoy, avoid, suggest, finish and consider take -ing. Want, decide, hope and plan take to + verb. Stop doing means end an activity; stop to do means pause another activity. Remember doing recalls the past; remember to do is a task.',

'Will is used for spontaneous decisions, predictions and promises. Be going to is for intentions and evidence-based predictions. Present Continuous describes arrangements. Use Present Simple after when, until and as soon as for future events.',
'Wish + past simple expresses an unreal present wish. Wish + past perfect expresses past regret. Wish + would expresses a desired change in another person or situation. If only makes the wish stronger.',

'A/an is for one non-specific countable noun; choose by sound. The is for a specific or known noun. Much/little go with uncountable nouns; many/few with plurals. A few/a little mean some; few/little emphasize not enough.',
'Prefixes change meaning: un-, im-, dis-, re-, mis-. Suffixes change word class: -tion/-ment/-ness (noun), -ful/-less/-able (adjective), -ly (adverb), -en/-ify (verb). Check the grammar around the gap before choosing a form.'

ope;if(PE.some(e=>e.kind==='import'&&e.payload.importId===importId)){document.getElementById('importMessage').textContent=L('Bu kayıt daha önce aktarıldı.','This progress was already imported.');return}eventRecord('import',{importId,known:Array.isArray(legacy?.known)?legacy.known:[],best:+legacy?.best||0,wc:+legacy?.wc||0,wb:+legacy?.wb||0,review:{...Object.fromEntries((legacy?.gw||[]).map(id=>['grammar:'+id,{streak:0,errors:1,due:0}])),...(previous||{})}});document.getElementById('importMessage').textContent=L('Eski kayıtlar aktarıldı.','Old progress imported.')};document.getElementById('restoreBackup').onchange=async e=>{const f=e.target.files[0],message=document.getElementById('backupMessage');try{if(!f||f.size>5e6)throw Error();const data=JSON.parse(await f.text());if(data.format!=='buki-learning-v2'||!Array.isArray(data.events)||data.events.length>20000)throw Error();const allowed=['answer','essay','known','import','exam','activity','reward','save_word'];if(data.events.some(x=>!BukiCore.valid(x)||!x||typeof x.id!=='string'||!Number.isFinite(x.at)||!allowed.includes(x.kind)||!x.payload||typeof x.payload!=='object'||Array.isArray(x.payload)||JSON.stringify(x.payload).length>40000))throw Error();const existing=new Set(PE.map(e=>e.id));for(const x of data.events)if(!existing.has(x.id))PP.add(x.id);PE=BukiCore.merge(PE,data.events);rebuild();persistPlus();queueSync();message.textContent=L('Yedek birleştirildi.','Backup merged.')}catch(err){message.textContent=L('Geçerli bir Buki yedeği seç (en fazla 5 MB).','Choose a valid Buki backup (up to 5 MB).')}}}

function makeWords(text){return text.trim().split('\n').map(line=>{const [w,t,s]=line.split('|');return {w,t,s};});}
function lesson(n,tr,en,rows){return {n,r:'<p>'+tr+'</p><p lang=en>'+en+'</p>',en,q:rows.trim().split('\n').map(row=>row+'|0|'+tr).join('\n')};}
function passage(title,text,rows){return {title,text,qs:rows.map(([q,correct,a,b,c,exp])=>{const o=sh([correct,a,b,c]);return {q,o,a:o.indexOf(correct),exp};})};}
function partnerships(text){return text.trim().split('\n').map((line,i)=>{const [w,t,s,bad]=line.split('|');const a=s.match(/\[(.*?)\]/)[1];return {id:'coll:'+i,w,t,s,a,other:[],coll:true,bad};});}

function grammarSkill(item){if(!item?.startsWith('grammar:'))return null;const [,g,q]=item.split(':').map((x,i)=>i?+x:x),question=G[g]?gq(g)[q]:null;if(!question)return null;const text=(question.p+' '+question.a).toLowerCase();if(/\b(since|for)\b/.test(question.a))return 'since / for';if(/\b(does|doesn.t|studies|goes|works|likes|plays|watches)\b/.test(text)&&/present|simple/i.test(G[g].n))return 'Present Simple · he / she / it';if(/\b(much|many|few|little|some|any)\b/.test(question.a))return 'Quantifiers · '+question.a;if(/\b(at|on|in)\b/.test(question.a))return 'Prepositions · '+question.a;return G[g].n+' · '+question.a;}

function dialogueStart(scenario){const rows=DIALOGUES[cefr][scenario];let step=0,firstCorrect=0,usedRepair=false;function show(){if(step===rows.length){eventRecord('activity',{type:'dialogue_complete',scenario,score:firstCorrect,total:rows.length});return plusRender(backBar('Dialogue')+`<div class=card><h1>✓ ${L('Diyalog tamamlandı','Dialogue complete')}</h1><p>${firstCorrect}/${rows.length} ${L('ilk denemede uygun yanıt','suitable replies on the first attempt')}</p><button class=opt onclick="dialogueHome()">${L('Diğer diyaloglar','More dialogues')}</button></div>`,'dialogue-result');}const [npc,correct,...rest]=rows[step],explanation=rest.pop(),options=sh([correct,...rest]);let locked=false;plusRender(backBar(cefr+' · '+L(...DIALOGUE_NAMES[scenario]))+`<div class=card><span class=eyebrow>${step+1} / ${rows.length}</span><div class=dialogue-line lang=en><strong>${['Server','Receptionist','Interviewer'][scenario]}</strong><p>${esc(npc)}</p><button id=dialogueAudio>▶ ${L('Dinle','Listen')}</button></div><p>${L('Senin cevabın:','Your reply:')}</p>${options.map((o,i)=>`<button class=opt data-dialogue=${i} lang=en>${esc(o)}</button>`).join('')}<div id=dialogueFeedback role=status></div></div>`,'dialogue');document.getElementById('dialogueAudio').onclick=()=>{if(!speakEnglish(npc))document.getElementById('dialogueFeedback').textContent=L('Sesli okuma bu tarayıcıda kullanılamıyor.','Speech synthesis is unavailable.');};pageCleanup=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();};app.querySelectorAll('[data-dialogue]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const ok=options[+b.dataset.dialogue]===correct;app.querySelectorAll('[data-dialogue]').forEach(x=>x.disabled=true);if(ok&&!usedRepair)firstCorrect++;eventRecord('activity',{type:'dialogue_answer',scenario,step,ok,repaired:usedRepair});const box=document.getElementById('dialogueFeedback');if(ok){box.innerHTML=`<div class=dialogue-feedback><p>✓ ${esc(explanation)}</p><button class=opt id=dialogueNext>${L('Konuşmaya devam et','Continue conversation')}</button></div>`;document.getElementById('dialogueNext').onclick=()=>{step++;usedRepair=false;show();};}else{usedRepair=true;box.innerHTML=`<div class=dialogue-feedback><p lang=en>“Could you clarify what you mean?”</p><p>${esc(explanation)}</p><button class=opt id=dialogueRepair>${L('Cevabımı düzelteyim','Let me rephrase')}</button></div>`;document.getElementById('dialogueRepair').onclick=show;}});}show();}

A1:{title:'The Lost Notebook',words:['notebook','library','friend'],nodes:{
start:{text:'Ada is at school. Her notebook is not in her bag. There is a note on her desk: “Ask a friend.” Ada can go to the library or the park. Where does she go?',choices:[['Go to the library','library'],['Go to the park','park']]},
library:{text:'The library is quiet. Ada sees her friend Ali. He has a blue notebook, but Ada’s notebook is green. “Look near the window,” he says. Ada sees a green book on a chair. What does she do?',choices:[['Check the name in the book','found'],['Ask the teacher for help','help']]},
park:{text:'At the park, Ada meets Ece. Ece has a green notebook. “I found it near the school,” she says. Ada is happy, but many students have green notebooks. What does she do?',choices:[['Check the name in the book','found'],['Ask the teacher for help','help']]},
found:{text:'Ada opens the notebook. Her name is on the first page. It is her notebook! She thanks her friend. At home, she puts it in her bag. Tomorrow, she wants to be early for school.',q:['How does Ada know the notebook is hers?','Her name is inside.','It is blue.','It has no pages.']},
help:{text:'Ada asks her teacher for help. The teacher checks the notebook and finds Ada’s name. “Write your class here too,” she says. Ada writes her class on the first page. Now her notebook is easy to return.',q:['What does Ada add to the notebook?','Her class.','A price.','A bus ticket.']}}},
A2:{title:'A Different Saturday',words:['museum','concert','message'],nodes:{
start:{text:'Efe and Lara planned to go to an outdoor concert on Saturday. In the morning, Efe received a message: heavy rain was expected, so the concert was cancelled. They still wanted to spend the afternoon together. Lara suggested a museum, while Efe wanted to cook lunch. Which plan do they choose?',choices:[['Visit the museum','museum'],['Cook lunch together','cook']]},
museum:{text:'At the museum, the main exhibition was crowded. A sign showed a small music workshop upstairs. Lara was interested, but Efe was hungry. They had two hours before their bus. They could join the workshop now or have lunch first and explore later.',choices:[['Join the workshop','music'],['Have lunch and take photos','photos']]},
cook:{text:'They found vegetables and rice in the kitchen, but no bread. While lunch was cooking, Lara noticed an old guitar. Efe had not played it for months. They could practise a short song after lunch or go outside to take photos when the rain stopped.',choices:[['Practise a song','music'],['Take photos after the rain','photos']]},
music:{text:'By the end of the afternoon, they had learned a simple tune. Neither of them played perfectly, but they enjoyed making music together. They sent a short recording to their friends. The concert had been cancelled, yet their day still included music. They decided to make another plan for the following Saturday.',q:['Why did they enjoy the afternoon?','They made music together.','They played without any mistakes.','They attended the original concert.']},
photos:{text:'After lunch, the rain stopped. They took photos of reflections in the street and chose their favourite three. Lara sent them to her grandmother with a short message about their day. The original plan had changed, but they had something new to remember. Next time, they agreed to check the weather earlier.',q:['What did Lara send her grandmother?','Photos and a message.','Concert tickets.','A new camera.']}}},
B1:{title:'The Community Challenge',words:['budget','volunteer','source'],nodes:{
start:{text:'A group of students wanted to organise a neighbourhood event. They had a small budget and several volunteers, but no agreed plan. Some residents wanted a repair café where people could fix old objects. Others suggested a community concert to raise money for future activities. You are helping the students choose their next step.',choices:[['Develop the repair café','repair'],['Develop the concert','concert']]},
repair:{text:'The repair café attracted interest, but only two volunteers had the right skills. A message claimed that the school would provide free tools, although nobody could identify its source. The team needed a reliable plan before inviting people. They could confirm the equipment and training, or reduce the event to a demonstration.',choices:[['Confirm resources before advertising','check'],['Offer a smaller demonstration','small']]},
concert:{text:'The concert plan depended on borrowing a sound system. A volunteer had heard that the school would lend one, but the arrangement was not confirmed. The students could contact the school directly or organise an acoustic performance that required less equipment. Both options would change how they spent their budget.',choices:[['Confirm resources before advertising','check'],['Offer a smaller acoustic event','small']]},
check:{text:'The team contacted the people responsible and discovered that some resources were available, but not everything they had expected. They revised the plan and clearly described what visitors could expect. On the day, volunteers knew their responsibilities. The event was modest but well organised. Afterwards, the students agreed that checking information early had prevented a much bigger problem.',q:['What helped prevent problems?','Checking resources before making promises.','Trusting every message immediately.','Spending the whole budget at once.']},
small:{text:'The students reduced the scale of the event and explained their decision to residents. This disappointed a few people, but it allowed the volunteers to prepare properly. Visitors offered suggestions for the next event, and several new volunteers joined. The team learned that starting small could build confidence, provided they were honest about what they could deliver.',q:['What did the smaller event achieve?','It built confidence and attracted volunteers.','It satisfied absolutely everyone.','It removed the need for preparation.']}}},
B2:{title:'The Exhibition Decision',words:['heritage','consent','counterargument'],nodes:{
start:{text:'A city museum is preparing an exhibition about the neighbourhood’s changing identity. It has collected photographs and personal accounts, but some contributors are concerned about how their stories will be represented. The opening date is approaching. As part of the curatorial team, you must decide whether to prioritise a consent review or a public discussion about the exhibition’s interpretation.',choices:[['Review contributors’ consent','consent'],['Discuss competing interpretations','debate']]},
consent:{text:'The review reveals that one contributor agreed to a private interview but did not expect the recording to be played publicly. Another wants an explanation added beside a photograph. Meeting both requests would require changes to the display. The team could postpone the opening briefly to complete the review, or open a smaller exhibition using only material whose intended use is clearly agreed.',choices:[['Postpone and complete the review','delay'],['Open a smaller, clearly documented display','limited']]},
debate:{text:'At the discussion, residents challenge an assumption in the exhibition: that new development always weakens cultural heritage. Others argue that the display overlooks people who have been displaced. These counterarguments cannot be resolved by adding a single sentence. The team considers a short postponement for revision or a smaller initial display that openly identifies what is still being debated.',choices:[['Postpone and revise the interpretation','delay'],['Open a smaller display with explicit limitations','limited']]},
delay:{text:'The museum announces a revised opening date and explains the reason without identifying individual contributors. The extra time allows it to clarify permissions and include perspectives that had been underrepresented. Some sponsors question the delay, but the team documents its decisions and the remaining limitations. The exhibition eventually opens with a process for contributors to raise concerns. Trust is treated as an ongoing responsibility rather than something secured by a single approval.',q:['Which principle guides the revised process?','Accountability continues after the opening.','A delay automatically resolves every concern.','Sponsors should determine every personal account.']},
limited:{text:'The museum opens a smaller exhibition and states clearly which questions remain unresolved. Material without appropriate permission is withheld. Visitors are invited to comment, but the team does not present a feedback form as a substitute for consent. A later section will incorporate further work once contributors have reviewed the relevant material. The decision balances public access with the need to avoid presenting an unfinished interpretation as a complete account.',q:['What distinction does the team preserve?','Public feedback does not replace contributor consent.','All omitted material is inaccurate.','An unfinished interpretation cannot be discussed.']}}}

unitHome=function(){const units=unitStates(),passed=units.filter(u=>u.passed).length,next=units.findIndex(u=>!u.passed);plusRender(backBar(cefr+' · '+L('Öğrenme haritam','Learning map'))+`<div class=card><span class=eyebrow>${cefr} · YOUR LEARNING TRAIL</span><h1>${L('Bir durak daha ilerle','One more stop on your journey')}</h1><p>${passed}/${units.length} ${L('ünite tamamlandı','units complete')}</p><progress max=${units.length} value=${passed}></progress><small>${L('Yeşil durak: sınavda en az %80. Çizgili durak: önerilen sonraki ünite. Diğer duraklar da açık.','Green: at least 80% on the test. Outlined: suggested next unit. Every unit is open.')}</small></div><div class=learning-trail>${units.map((u,i)=>`<button class="trail-stop ${u.passed?'passed':''} ${i===next?'current':''}" onclick="unitDetail(${i})"><span class=trail-number>${u.passed?'✓':i+1}</span><span><strong>${esc(L(u.tr,u.en))}</strong><small>${completedSteps(i).size}/7 ${L('görev','tasks')} · ${u.attempts?u.best+'%':L('Sınav bekliyor','Test pending')}</small></span><span aria-hidden=true>→</span></button>`).join('')}</div>${passed===units.length?`<div class=card><h2>🎉 ${L('Bölümün tüm üniteleri tamamlandı','All course units complete')}</h2><p>${L('Bu bir çalışma başarısıdır; resmî seviye belgesi değildir.','This is a study achievement, not a formal certificate.')}</p><button class=opt onclick="${cefr==='B2'?'mockHome()':`openCourse('${BukiLevels.levels[BukiLevels.levels.indexOf(cefr)+1]}')`}">${L('Sonraki adım','Next step')}</button></div>`:''}`,'learning-map');};

async function supportRPC(name,args={}){const token=await plusToken();if(!token)throw Error('auth');const response=await fetch(PLUS_SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:PLUS_PK,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});const text=await response.text();let data={};try{data=text?JSON.parse(text):null;}catch{}if(!response.ok){const msg=data?.message||'';throw Error(response.status===401?'auth':/support_rate/.test(msg)?'rate':/support_missing/.test(msg)?'missing':response.status===404?'setup':'network');}return data;}
async function wakeSupport(){try{const token=await plusToken();if(!token)return;await fetch(PLUS_SB+'/functions/v1/buki-support',{method:'POST',headers:{apikey:PLUS_PK,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}',cache:'no-store'});}catch{/* Persisted server outbox retries without the student staying online. */}}
function supportError(e){return L(({auth:'Destek için hesabına giriş yap.',rate:'Gönderim sınırına ulaştın: dakikada 5, günde 50 mesaj. Biraz sonra tekrar dene.',setup:'Destek bağlantısı henüz kurulmamış.',missing:'Bu sohbetin süresi dolmuş. Yeni sohbet açabilirsin.'})[e.message]||'Bağlantı kurulamadı. Mesajını kontrol edip tekrar dene.',({auth:'Sign in to use support.',rate:'Limit reached: 5 messages per minute and 50 per day. Try again later.',setup:'Support is not configured yet.',missing:'This conversation has expired. Start a new one.'})[e.message]||'Connection failed. Check your message and try again.');}
window.BukiSupport=async function(){
 if(closeSupportSession)closeSupportSession();
 const account=sessionUser();
 const box=modalPanel('bukiSupport',L('Canlı destek','Support chat'),`<p class=support-notice>${L('Yöneticiye özel mesaj · Yanıtlar bu ekranda görünür. Her mesaj gönderildikten 10 gün sonra silinir. Mesajların destek için yöneticinin Telegram sohbetine iletilir.','Private messages to the administrator · Replies appear here. Each message is deleted 10 days after sending. Messages are forwarded to the administrator’s Telegram support chat.')}</p><div class=support-layout><aside><button class=studio-primary id=supportNew>${L('Yeni sohbet','New conversation')} +</button><div id=supportThreads aria-label="${L('Geçmiş sohbetler','Past conversations')}"></div></aside><section class=support-conversation><label for=supportSubject>${L('Konu','Subject')}</label><input id=supportSubject maxlength=80 placeholder="${L('Nasıl yardımcı olabiliriz?','How can we help?')}"><button class=quiet id=supportOlder hidden>${L('Önceki mesajları göster','Show earlier messages')}</button><div id=supportMessages class=support-messages role=log aria-label="${L('Sohbet mesajları','Conversation messages')}"></div><form id=supportForm><label for=supportText>${L('Mesajın','Your message')}</label><textarea id=supportText maxlength=2000 rows=3 placeholder="${L('Mesajını yaz…','Write your message…')}"></textarea><div class=support-compose><small id=supportCount>0/2000</small><button class=studio-primary id=supportSend type=submit>${L('Gönder','Send')} →</button></div></form><p id=supportStatus role=status></p><small>${L('Yanıt ekran açıkken yaklaşık 8 saniyede bir kontrol edilir. Anında yanıt garantisi yoktur.','Replies are checked about every 8 seconds while this window is open. An immediate reply is not guaranteed.')}</small></section></div>`);
 const el=id=>box.querySelector('#'+id),msg=el('supportMessages'),status=el('supportStatus'),input=el('supportText'),subject=el('supportSubject');
 let thread=null,threads=[],messages=new Map(),closed=false,busy=false,reloadPending=false,sending=false,generation=0,offset=0,timer,expiryTimer,retry=null,hasOlder=false,lastMessagesHTML=null,lastThreadsHTML=null;

 const close=()=>{if(closed)return;closed=true;clearInterval(timer);clearInterval(expiryTimer);window.removeEventListener('storage',accountChanged);window.removeEventListener('pagehide',close);document.removeEventListener('visibilitychange',visible);messages.clear();threads=[];retry=null;input.value='';box.remove();if(closeSupportSession===close)closeSupportSession=null;};

 function drawThreads(){const content=threads.filter(t=>Date.parse(t.last_at)+864e6>now()).map(t=>`<button class="support-thread ${t.id===thread?'selected':''}" data-thread="${esc(t.id)}" ${sending?'disabled':''}><strong>${esc(t.title)}</strong><small>${new Date(t.last_at).toLocaleString(bukiLang==='en'?'en-GB':'tr-TR')}</small></button>`).join('')||`<p>${L('Son 10 günde sohbet yok.','No conversations in the last 10 days.')}</p>`;if(content===lastThreadsHTML)return;lastThreadsHTML=content;el('supportThreads').innerHTML=content;box.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>select(b.dataset.thread));}
 function draw(){if(!alive())return;const nearBottom=msg.scrollHeight-msg.scrollTop-msg.clientHeight<100;const rows=[...messages.values()].filter(m=>Date.parse(m.expires_at)>now()).sort((a,b)=>a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id));messages=new Map(rows.map(m=>[m.id,m]));const content=rows.map(m=>`<article class="support-bubble ${m.sender==='student'?'mine':'theirs'}"><strong>${m.sender==='student'?L('Sen','You'):L('Yönetici','Support')}</strong><p>${esc(m.body)}</p><small>${new Date(m.created_at).toLocaleString(bukiLang==='en'?'en-GB':'tr-TR')} · ${L('Silinir: ','Expires: ')}${new Date(m.expires_at).toLocaleDateString(bukiLang==='en'?'en-GB':'tr-TR')}</small>${m.sender==='student'?`<small>${({pending:L('İletim bekliyor','Queued for delivery'),sending:L('Telegram’a iletiliyor','Forwarding to Telegram'),sent:L('Telegram’a iletildi','Delivered to Telegram'),failed:L('Telegram’a iletilemedi','Telegram delivery failed')})[m.delivery]||''}</small>${m.delivery==='failed'?`<button class=quiet data-retry="${esc(m.id)}">${L('İletimi tekrar dene','Retry delivery')}</button>`:''}`:''}</article>`).join('')||`<div class=support-empty>${studioIcon('chat')}<p>${thread?L('Bu sohbette henüz mesaj yok veya mesajların süresi doldu.','No messages yet, or all messages have expired.'):L('Yeni mesajınla bir sohbet başlat.','Start a conversation with your message.')}</p></div>`;
 if(lastMessagesHTML!==content){lastMessagesHTML=content;msg.innerHTML=content;if(nearBottom)msg.scrollTop=msg.scrollHeight;box.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await supportRPC('buki_support_retry',{message_id:b.dataset.retry});wakeSupport();await load();}catch(e){if(alive())status.textContent=supportError(e);}});}
 el('supportOlder').hidden=!hasOlder||!thread;
 }

 if(current){const first=[...messages.values()].sort((a,b)=>a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id))[0];const result=await supportRPC('buki_support_list',{conversation_id:current,...(older&&first?{before_time:first.created_at,before_id:first.id}:{})});if(!alive()||gen!==generation)return;offset=Date.parse(result.server_now)-Date.now();for(const m of result.rows)messages.set(m.id,m);if(older||messages.size<=50)hasOlder=result.rows.length===50;}
 draw();status.textContent=L('Güncel · mesajlar kişisel hesabına özeldir.','Up to date · messages are private to your account.');
 }catch(e){if(alive()&&gen===generation){status.textContent=supportError(e);if(e.message==='auth')close();if(e.message==='missing'){thread=null;messages.clear();subject.disabled=false;draw();}}}finally{busy=false;if(reloadPending){reloadPending=false;load();}}}
 el('supportNew').onclick=()=>select(null);el('supportOlder').onclick=()=>load(true);input.oninput=()=>{el('supportCount').textContent=input.value.length+'/2000';};
 el('supportForm').onsubmit=async e=>{e.preventDefault();if(!alive())return;const body=input.value.trim();if(!body){status.textContent=L('Önce bir mesaj yaz.','Write a message first.');return;}const target=thread,gen=generation;if(!retry||retry.body!==body||retry.thread!==target)retry={id:newId(),body,thread:target};const send=el('supportSend');sending=true;send.disabled=true;el('supportNew').disabled=true;input.disabled=true;subject.disabled=true;drawThreads();status.textContent=L('Gönderiliyor…','Sending…');try{
 const result=await supportRPC('buki_support_send',{message_id:retry.id,message_body:body,conversation_id:target,subject:subject.value.trim()||L('Destek','Support')});if(!alive()||gen!==generation)return;thread=result.thread_id;retry=null;input.value='';el('supportCount').textContent='0/2000';wakeSupport();await load();status.textContent=L('Kaydedildi. Telegram iletim durumunu mesajın altında görebilirsin.','Saved. Telegram delivery status appears beneath your message.');
 }catch(err){if(alive())status.textContent=supportError(err);}finally{if(alive()){sending=false;send.disabled=false;el('supportNew').disabled=false;input.disabled=false;subject.disabled=!!thread;drawThreads();input.focus();}}};
 if(account==='guest'){status.textContent=L('Destek için giriş yapmalısın.','Sign in to contact support.');el('supportSend').disabled=true;return;}
 timer=setInterval(()=>load(),8000);expiryTimer=setInterval(()=>{if(alive()){draw();drawThreads();}},1000);await load();
};

hub();

(()=>{
