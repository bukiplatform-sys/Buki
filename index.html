If you heat ice, it ___.|will melt|melts|would melt|melted|1|Zero conditional: genel gerçek.`},
{n:'🎯 Passive',r:`<p><b>be + V3</b>. Zaman be fiilinde değişir: is done, was done, has been done, will be done, is being done, had been done.</p><p>Modal: <i>must be done, can be seen</i>. Future perfect: <i>will have been done</i>.</p><p>Eylemi yapan bilinmiyorsa/önemsizse kullanılır; gerekirse <b>by</b> ile eklenir.</p><p><b>Causative</b>: have + nesne + V3 → <i>I had my car repaired</i> (başkasına yaptırmak).</p><p><b>Reporting passive</b>: <i>He is said to be rich. / It is believed that...</i></p>`,q:`The bridge ___ in 1998.|built|was built|has been built|is building|1|Geçmiş + edilgen → was built.
The problem ___ at the moment.|is discussing|is being discussed|has discussed|discussed|1|Şu an süren edilgen → is being + V3.
The documents must ___ before Friday.|submit|be submitted|being submitted|have submitted|1|Modal passive: must be + V3.
I ___ my car repaired last week.|had|have|was|made|0|Causative: had + nesne + V3.
He is said ___ a millionaire.|to be|being|he is|that be|0|Reporting passive: is said + to-inf.
By next year, the new library ___.|will complete|will have been completed|completes|is completing|1|Future perfect passive.`},
{n:'💬 Reported Speech',r:`<p><b>Backshift</b>: present simple → past simple, present perfect → past perfect, will → would, can → could, must → had to.</p><p><b>Zaman/yer</b>: now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there.</p><p><b>Sorular</b>: if/whether + düz cümle sırası (do/does yok): <i>He asked where I lived.</i></p><p><b>tell + kişi</b>, say + (to) kişi. Fiiller: suggest + V-ing, promise/offer to + V1, advise/ask sb to + V1, deny/admit + V-ing.</p>`,q:`She said, 'I am tired.' → She said that she ___ tired.|is|was|had been|will be|1|Backshift: am → was.
He asked me, 'Where do you live?' → He asked me where I ___.|do live|lived|live|did live|1|Soru: düz sıra + backshift.
'I will call you.' → He promised that he ___ me.|will call|would call|called|calls|1|will → would.
She ___ me to close the window.|said|told|asked that|suggested|1|tell + kişi + to-inf.
He suggested ___ a taxi.|to take|taking|take|that to take|1|suggest + V-ing.
She asked whether I ___ the answer.|know|knew|will know|knowing|1|Backshift: know → knew.`},
{n:'🔗 Relative Clauses',r:`<p><b>who</b> (insan), <b>which</b> (şey), <b>that</b> (insan/şey, sadece defining), <b>whose</b> (aitlik), <b>where</b> (yer), <b>when</b> (zaman).</p><p><b>Defining</b>: virgülsüz, kimlik belirtir, that kullanılabilir, nesne ise atılabilir.</p><p><b>Non-defining</b>: virgüllü, ekstra bilgi: <i>My brother, who lives in Ankara, is a doctor.</i> Burada <b>that kullanılmaz</b>, zamir atılamaz.</p><p>Edat + which: <i>the city in which she was born.</i> Kısaltma: <i>the man sitting there</i> (= who is sitting).</p><p>everything / all / something / the only sonrası <b>that</b>.</p>`,q:`The woman ___ car was stolen called the police.|who|which|whose|whom|2|Aitlik → whose.
My laptop, ___ I bought last year, has stopped working.|that|which|what|who|1|Non-defining'de that kullanılmaz.
This is the house ___ I grew up.|which|where|who|whose|1|Yer → where.
The man ___ next to me is my uncle.|sit|sat|sitting|who sitting|2|Reduced relative: who is sitting → sitting.
Everything ___ he said was true.|what|which|that|who|2|everything sonrası that.
The city in ___ she was born is huge.|that|which|where|who|1|Edat + which (that olmaz).`},
{n:'💪 Modals',r:`<p><b>Çıkarım (şimdi)</b>: must be (kesin), may/might/could be (olası), can't be (imkânsız).</p><p><b>Çıkarım (geçmiş)</b>: must have + V3, might have + V3, can't have + V3.</p><p><b>Zorunluluk</b>: must / have to. <b>don't have to</b> = gerek yok ≠ <b>mustn't</b> = yasak.</p><p><b>Tavsiye</b>: should / ought to. <b>should have + V3</b> = yapmalıydım (pişmanlık).</p><p><b>Geçmiş yetenek</b>: could (genel), <b>was able to</b> (tek seferlik başarı).</p>`,q:`You ___ smoke in the hospital; it is forbidden.|don't have to|mustn't|needn't|shouldn't|1|Yasak → mustn't.
He is not answering. He ___ be asleep.|can|might|must have|should have|1|Olasılık → might be.
The lights are off. They ___ left already.|must have|should|can|may to|0|Geçmiş kesin çıkarım → must have + V3.
I ___ studied harder; now I have failed the exam.|should have|must have|can have|would|0|Pişmanlık → should have + V3.
She ___ be the thief; she was abroad that day.|mustn't|can't|doesn't have to|needn't|1|İmkânsız çıkarım → can't be.
After a long fight, the firefighters ___ put out the fire.|could|were able to|can|might|1|Tek seferlik başarı → were able to.`},
{n:'🔁 Gerund / Infinitive',r:`<p><b>+ V-ing</b>: enjoy, avoid, suggest, mind, consider, deny, finish, keep, postpone, risk, admit, can't help; ayrıca <u>edatlardan sonra</u> (interested in <i>studying</i>).</p><p><b>+ to V1</b>: decide, hope, plan, manage, refuse, afford, promise, agree, want, would like.</p><p><b>Anlam değiştirenler</b>: stop doing (bırakmak) / stop to do (amaç); remember/forget doing (geçmiş) / to do (yapılacak iş); try doing (deneme) / try to do (çaba).</p><p>make / let + nesne + <b>V1</b> (to yok).</p>`,q:`She avoided ___ the question.|to answer|answering|answer|to answering|1|avoid + V-ing.
We decided ___ a new car.|buying|to buy|buy|to buying|1|decide + to-inf.
I forgot ___ the door, so it is open.|locking|to lock|lock|to locking|1|forget to do = yapmayı unutmak.
He stopped ___ because he was tired.|to run|running|run|to running|1|stop doing = bırakmak.
She is interested ___ for a scholarship.|to apply|in applying|on applying|applying|1|Edat + V-ing.
The teacher made us ___ the essay again.|to write|writing|write|wrote|2|make + nesne + V1.`},
{n:'🧩 Linkers',r:`<p><b>Zıtlık</b>: although / even though / though + <u>S + V</u>; despite / in spite of + <u>isim ya da V-ing</u> (despite the fact that + S + V); whereas / while (iki şeyi kıyaslar); however, nevertheless (cümle başı, virgüllü).</p><p><b>Sebep</b>: because / since / as + S + V; because of / due to / owing to + isim.</p><p><b>Sonuç</b>: so, therefore, as a result, consequently.</p><p><b>Ekleme</b>: moreover, furthermore, in addition (to + isim/V-ing).</p><p><b>Amaç</b>: in order to / so as to + V1; so that + S + V.</p>`,q:`___ the heavy rain, the match continued.|Although|Despite|However|Because|1|İsim öncesi zıtlık → Despite.
___ he was tired, he kept working.|Despite|In spite of|Although|Due to|2|S + V öncesi zıtlık → Although.
The flight was cancelled ___ the storm.|because|due to|as|since|1|İsim öncesi sebep → due to.
He is rich; ___, he is not happy.|however|although|whereas|because of|0|Cümleler arası zıtlık → however.
She studied hard ___ she could pass the exam.|so that|despite|therefore|whereas|0|Amaç → so that + S + V.
Ali loves football, ___ his brother prefers tennis.|despite|whereas|so that|therefore|1|Kıyaslama → whereas.`}];
const gq=i=>G[i].q.split('\n').map(l=>{const a=l.split('|'),o=a.slice(1,5),c=o[+a[5]];return{l:'Doğru seçeneği seç',p:a[0],o:sh(o),a:c,w:{w:a[0].replace('___',c),t:a[6],s:a[6]}}});
const RT=['space exploration','the history of coffee','sleep and memory','urban gardening','renewable energy','social media and teenagers','the origins of the Olympic Games','artificial intelligence in education','plastic pollution in the oceans','why people procrastinate'];
const RS={title:'Why Do Chameleons Change Colour?',text:'Chameleons are famous for changing colour, but many people misunderstand why they do it. It is commonly believed that they change colour to blend in with their surroundings. In fact, camouflage is only a small part of the story. Scientists have discovered that chameleons change colour mainly to communicate and to control their body temperature. A male that meets a rival, for example, may show bright, aggressive colours, whereas a relaxed chameleon usually stays green or brown. Darker shades absorb more heat, so a cold chameleon often turns dark in the morning sun.\nThe colour change happens because special cells in the skin contain tiny crystals. When the animal is excited, these crystals move apart and reflect different wavelengths of light. Despite their reputation, then, chameleons are not living disguises; they are expressive animals whose skin tells us how they feel.',qs:[{q:'What is the main idea of the passage?',o:['Chameleons change colour only to hide','Chameleons change colour for several reasons, not just camouflage','Chameleons are dangerous to their rivals','Chameleons cannot control their colour'],a:1,exp:'Metin, camouflage’ın küçük bir neden olduğunu, asıl nedenlerin iletişim ve ısı olduğunu söylüyor.'},{q:'TRUE / FALSE / NOT GIVEN: A cold chameleon may turn darker to absorb heat.',o:['True','False','Not Given'],a:0,exp:'Metinde: koyu renkler daha fazla ısı emer.'},{q:'TRUE / FALSE / NOT GIVEN: Female chameleons change colour more often than males.',o:['True','False','Not Given'],a:2,exp:'Dişi/erkek karşılaştırması metinde yok → Not Given.'},{q:'The word rival in the text is closest in meaning to…',o:['friend','competitor','predator','parent'],a:1,exp:'rival = rakip → competitor.'}]};
const RX=[
['The Story of Coffee','Legend says a goat herder in Ethiopia noticed that his goats became unusually energetic after eating red berries. Monks later used the berries to stay awake during long prayers. By the fifteenth century, coffee was grown in Yemen, and coffeehouses soon appeared in Middle Eastern cities, where people gathered to talk, play chess and hear news. European travellers brought the drink home, and by the 1700s coffee had become one of the most traded products in the world.',[['According to the legend, who first noticed the effect of the berries?',['Monks','A goat herder','Traders','Sailors'],1,'Efsaneye göre keçi çobanı fark etmiş.'],['TRUE / FALSE / NOT GIVEN: Coffee was grown in Yemen by the fifteenth century.',['True','False','Not Given'],0,'Metinde 15. yüzyılda Yemen’de yetiştirildiği yazıyor.'],['The word gathered is closest in meaning to…',['argued','met together','travelled','hid'],1,'gather = toplanmak.']]],
['Sleep and Memory','During sleep, the brain does not simply switch off. Researchers have found that it replays the events of the day and moves important information from short-term to long-term memory. Students who sleep well after studying usually remember more than those who stay awake all night. Lack of sleep also reduces concentration and makes people more likely to make mistakes. Experts therefore recommend that adults sleep seven to nine hours a night.',[['What happens to information during sleep?',['It is deleted','It is moved to long-term memory','It is ignored','It is made shorter'],1,'Beyin bilgiyi kısa süreli bellekten uzun süreliye taşır.'],['TRUE / FALSE / NOT GIVEN: Students who stay up all night remember more.',['True','False','Not Given'],1,'Metin tam tersini söylüyor.'],['The word concentration is closest in meaning to…',['focus','speed','noise','illness'],0,'concentration = odaklanma.']]],
['Urban Gardening','In many crowded cities, people are turning rooftops, balconies and empty lots into small gardens. Urban gardening provides fresh vegetables, but its benefits go further. Plants cool the air, reduce noise and give neighbours a reason to meet. In some neighbourhoods, community gardens have even lowered crime rates. However, gardeners must be careful about polluted soil, which can make food unsafe to eat.',[['Which is NOT mentioned as a benefit?',['Cooler air','Less noise','Higher salaries','Social contact'],2,'Maaş artışı metinde geçmiyor.'],['TRUE / FALSE / NOT GIVEN: Polluted soil can be a problem for urban gardeners.',['True','False','Not Given'],0,'Son cümle bunu söylüyor.'],['The word However introduces…',['an example','a contrast','a result','a time'],1,'However = zıtlık belirten bağlayıcı.']]],
['The Ancient Olympic Games','The ancient Olympic Games began in Greece in 776 BC and were held every four years in honour of Zeus. Only free Greek men could compete, and the winners received olive wreaths instead of money. The games continued for nearly twelve centuries until a Roman emperor banned them. In 1896, a French educator named Pierre de Coubertin helped bring them back, and the first modern Games took place in Athens.',[['What did ancient winners receive?',['Gold medals','Olive wreaths','Money','Land'],1,'Zeytin dalı çelengi, para değil.'],['TRUE / FALSE / NOT GIVEN: Women competed in the ancient Games.',['True','False','Not Given'],1,'Sadece özgür Yunan erkekleri yarışabiliyordu.'],['The word banned is closest in meaning to…',['allowed','forbade','organised','copied'],1,'ban = yasaklamak.']]],
['Plastic in the Oceans','Every year, millions of tons of plastic end up in the oceans. Over time, the waste breaks into tiny pieces called microplastics, which are eaten by fish and seabirds. Scientists have even found microplastics in sea salt and drinking water. Many countries have started banning single-use bags, but experts say that real progress will require better recycling systems and a change in people’s shopping habits.',[['What are microplastics?',['Large bottles','Tiny pieces of broken plastic','A type of fish','Recycled bags'],1,'Tanım metnin ikinci cümlesinde.'],['TRUE / FALSE / NOT GIVEN: Microplastics have been found in drinking water.',['True','False','Not Given'],0,'Metinde açıkça geçiyor.'],['The phrase single-use means…',['used only once','very strong','expensive','colourful'],0,'single-use = tek kullanımlık.']]],
['Why We Procrastinate','Procrastination is not simply laziness. Psychologists explain that people often delay tasks because they want to avoid unpleasant feelings such as fear of failure or boredom. Unfortunately, the relief is short-lived, and stress increases as the deadline approaches. Breaking a big task into small steps and starting with just five minutes are two methods that many experts recommend.',[['Why do people procrastinate, according to psychologists?',['They are lazy','To avoid unpleasant feelings','They have too much time','They enjoy stress'],1,'Ertelemenin nedeni nahoş duygulardan kaçınmak.'],['TRUE / FALSE / NOT GIVEN: Starting with five minutes is recommended by some experts.',['True','False','Not Given'],0,'Son cümle bunu söylüyor.'],['The word short-lived means…',['lasting a short time','very loud','dangerous','helpful'],0,'short-lived = kısa ömürlü.']]],
['The Silk Road','The Silk Road was not a single road but a network of trade routes linking China with the Mediterranean. Merchants carried silk, spices and paper westward, while horses, glass and silver travelled east. However, goods were not the only things that moved along these routes. Religions, technologies and even diseases spread between distant cultures. Many travellers never covered the whole distance; instead, goods passed through the hands of many traders.',[['What was the Silk Road?',['A single highway','A network of trade routes','A river','A wall'],1,'İlk cümle: bir ticaret yolları ağı.'],['TRUE / FALSE / NOT GIVEN: Paper travelled from China to the west.',['True','False','Not Given'],0,'Kağıt batıya taşınıyordu.'],['The word distant is closest in meaning to…',['far away','ancient','similar','friendly'],0,'distant = uzak.']]],
['Social Media and Attention','Many teenagers check their phones dozens of times a day. Some studies suggest that constant notifications make it harder to concentrate on long tasks such as reading a book. Others argue that social media helps young people stay connected and share creative work. The evidence is mixed, and researchers agree that how people use social media matters more than how many hours they spend on it.',[['What do researchers agree on?',['Social media is always harmful','The way people use it is important','Teenagers should delete accounts','Phones improve attention'],1,'Son cümle: kullanım biçimi daha önemli.'],['TRUE / FALSE / NOT GIVEN: All studies show that social media harms concentration.',['True','False','Not Given'],1,'Metinde “Some studies” denmiş, hepsi değil.'],['In this text, mixed means…',['not consistent','delicious','tidy','new'],0,'mixed evidence = tutarsız/karışık kanıtlar.']]],
['Renewable Energy','Solar and wind power have become much cheaper over the past decade. In many countries, building a new solar farm now costs less than running an old coal plant. The main challenge is storage: the sun does not always shine and the wind does not always blow. Engineers are therefore developing larger batteries and smarter networks that can share electricity between regions.',[['What is the main challenge of renewable energy?',['High cost','Storage','Lack of engineers','Noise'],1,'The main challenge is storage.'],['TRUE / FALSE / NOT GIVEN: Solar power is now more expensive than coal.',['True','False','Not Given'],1,'Metin tam tersini söylüyor.'],['The word challenge is closest in meaning to…',['difficulty','prize','solution','argument'],0,'challenge = zorluk.']]],
['The Clever Octopus','Octopuses are among the most intelligent invertebrates. In laboratory tests, they have opened jars, solved mazes and even escaped from closed tanks. Each arm contains many neurons, so it can act almost independently. Surprisingly, most octopuses live only one to two years, which makes their intelligence even more puzzling for scientists.',[['Why is the octopus lifespan puzzling?',['It is short compared with their intelligence','It is extremely long','It is unknown','It depends on food'],0,'Zekileri uzun, ömürleri kısa.'],['TRUE / FALSE / NOT GIVEN: Octopuses have escaped from closed tanks.',['True','False','Not Given'],0,'Laboratuvar testlerinde kaçtıkları yazıyor.'],['The word independently means…',['without help from others','slowly','together','loudly'],0,'independently = bağımsız bir şekilde.']]],
['Working from Home','Since the pandemic, many companies have allowed employees to work from home. Workers often report higher satisfaction because they save commuting time and have more flexible schedules. On the other hand, some people feel isolated and find it difficult to separate work from private life. Managers, meanwhile, worry about teamwork and creativity. As a result, a hybrid model, with some days at home and some in the office, is becoming popular.',[['What is a hybrid model?',['Working only at home','Working only in the office','A mix of home and office work','Working at night'],2,'Bazı günler evde, bazı günler ofiste.'],['TRUE / FALSE / NOT GIVEN: All employees prefer to work from home.',['True','False','Not Given'],1,'Bazı insanlar kendini yalnız hissediyor.'],['The word isolated means…',['alone, cut off from others','angry','tired','busy'],0,'isolated = izole, yalnız.']]],
['Honey Bees','A honey bee colony can contain up to fifty thousand bees, and each one has a specific job. Younger bees clean the hive and feed the larvae, whereas older bees collect nectar. When a worker finds a good source of flowers, it performs a waggle dance to show the others the direction and distance. Bees are also essential for farming, since they help pollinate about one third of the food we eat.',[['What is the purpose of the waggle dance?',['To warm the hive','To show where flowers are','To scare enemies','To choose a queen'],1,'Yön ve mesafeyi göstermek için.'],['TRUE / FALSE / NOT GIVEN: Younger bees collect nectar.',['True','False','Not Given'],1,'Nektarı yaşlı aarılar topluyor.'],['The word essential is closest in meaning to…',['absolutely necessary','dangerous','optional','expensive'],0,'essential = vazgeçilmez.']]],
['Learning Languages as an Adult','It is often said that children learn languages faster than adults, but research gives a more complex picture. Adults usually make quicker progress at the beginning because they understand grammar rules and can study strategically. Children, on the other hand, are more likely to achieve a native-like accent. The most important factor for both groups is regular practice and real communication.',[['What is the most important factor for learners?',['Age','Regular practice and communication','Accent','Grammar books'],1,'Son cümle: düzenli pratik ve gerçek iletişim.'],['TRUE / FALSE / NOT GIVEN: Adults are quicker at the beginning.',['True','False','Not Given'],0,'Adults usually make quicker progress at the beginning.'],['The word strategically means…',['in a planned way','by accident','slowly','secretly'],0,'strategically = planlı biçimde.']]],
['The Printing Press','Before the 1450s, books in Europe were copied by hand, which made them rare and expensive. Johannes Gutenberg’s printing press, with its movable metal letters, allowed printers to produce hundreds of copies in a short time. As a result, prices fell and literacy increased. New ideas, including those of the Reformation and the Scientific Revolution, spread across the continent far more quickly than before.',[['What was a result of the printing press?',['Books became rarer','Literacy increased','Handwriting disappeared at once','Libraries closed'],1,'As a result, prices fell and literacy increased.'],['TRUE / FALSE / NOT GIVEN: Gutenberg invented paper.',['True','False','Not Given'],2,'Kağıdın icadından söz edilmiyor → Not Given.'],['The word literacy means…',['ability to read and write','love of books','a kind of printing','school fees'],0,'literacy = okuryazarlık.']]]];
const RL=[RS,...RX.map(a=>({title:a[0],text:a[1],qs:a[2].map(q=>({q:q[0],o:q[1],a:q[2],exp:q[3]}))}))];
const aiErr=e=>e&&e.code=='rate_limited'?'Çok hızlı denedin, biraz bekleyip tekrar dene.':e&&(e.code=='not_granted'||e.code=='na')?'AI özelliği şu an kullanılamıyor. Sayfayı claude.ai üzerinden açıp izin ver.':'Bir hata oldu, tekrar dene.';
async function ai(P){const sm=window.claude&&await claude.use('sample');if(!sm)throw{code:'na'};return sm.json(P)}
function gr(){say('Gramer zamanı! 🧠');$(`<div class=card><h1>Grammar</h1><small>Konu anlatımı + alıştırma + AI ile sınırsız soru</small></div><div class=grid>${G.map((t,i)=>`<button onclick=gt(${i})>${t.n}</button>`).join('')}<button class=wide onclick='quiz(()=>sh(G.flatMap((t,i)=>gq(i))).slice(0,15),1)'>🎓 Gramer Sınavı (15 soru)</button><button class=wide onclick=hub()>🏠 Ana Hub</button></div>`)}
function gt(i){const t=G[i];say('Önce kuralı oku 📘');$(`<div class=bar><button onclick=gr() style='padding:4px 12px'>✕</button></div><div class=card style='text-align:left'><h2 style='font-size:22px'>${t.n}</h2>${t.r}</div><div class=grid><button onclick='quiz(()=>gq(${i}))'>✍️ Alıştırma (6 soru)</button><button onclick=gai(${i})>🤖 AI ile 5 yeni soru</button></div><div id=res></div>`)}
async function gai(i){const t=G[i];say('Buki yeni sorular hazırlıyor… ✨','#c79bf2');res.innerHTML='<div class=card>⏳ Sorular hazırlanıyor…</div>';
try{const r=await ai(`Write 5 NEW multiple-choice grammar questions for a Bilkent Upper-Intermediate (B2) student on the topic: ${t.n.slice(2)}. Each question has exactly one blank (___) and 4 options. Return ONLY a JSON array of objects with keys q (sentence with ___), o (array of 4 options), a (index 0-3 of the correct option), exp (short Turkish explanation of the rule).`);
const qs=(Array.isArray(r)?r:[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length==4&&x.o[x.a]!=null).map(x=>({l:'Doğru seçeneği seç',p:esc(x.q),o:sh(x.o.map(esc)),a:String(x.o[x.a]),w:{w:esc(x.q.replace('___',x.o[x.a])),t:esc(x.exp),s:esc(x.exp)}}));
if(!qs.length)throw 0;quiz(()=>qs)}catch(e){res.innerHTML=`<div class=card>${aiErr(e)}</div>`}}
function rd(){say('Okuma zamanı! 📖');$(`<div class=card><h1>Reading</h1><small>B2 seviyesinde akademik metinler</small></div><div class=grid><button class=wide onclick=rdai()>🤖 Yeni metin üret (AI)</button><button class=wide onclick=hub()>🏠 Ana Hub</button></div><div id=res></div><div class=card style='text-align:left'><p class=lbl>📚 Okuma arşivi (${RL.length} metin)</p>${RL.map((p,i)=>`<button class=opt onclick=rdshow(RL[${i}])>${i+1}. ${esc(p.title)}</button>`).join('')}</div>`)}
async function rdai(){say('Buki sana metin arıyor… 🔎','#c79bf2');res.innerHTML='<div class=card>⏳ Metin hazırlanıyor… (biraz sürebilir)</div>';
try{const p=await ai(`Write an original 220-250 word academic-style reading passage at B2 level about: ${sh(RT)[0]}. Then write 5 questions: 1 main idea, 2 detail, 1 True/False/Not Given statement (options exactly True, False, Not Given), 1 vocabulary-in-context. Return ONLY valid JSON with keys title, text (paragraphs separated by newline), qs (array of objects with keys q, o (array of options), a (index of the correct option), exp (short Turkish explanation)).`);
if(!p||!p.text||!Array.isArray(p.qs))throw 0;p.qs=p.qs.filter(q=>q&&Array.isArray(q.o)&&q.o.length>1&&q.o[q.a]!=null);if(!p.qs.length)throw 0;rdshow(p)}catch(e){res.innerHTML=`<div class=card>${aiErr(e)}</div>`}}
function rdshow(p){let ch=[];say('Önce oku, sonra soruları yanıtla 📖');
$(`<div class=bar><button onclick=rd() style='padding:4px 12px'>✕</button></div><div class=card style='text-align:left'><h2 style='font-size:20px'>${esc(p.title)}</h2>${String(p.text).split('\n').filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')}</div>${p.qs.map((q,k)=>`<div class=card style='text-align:left'><b>${k+1}. ${esc(q.q)}</b>${q.o.map((x,j)=>`<button class=opt data-k=${k} data-j=${j}>${esc(x)}</button>`).join('')}<div id=e${k}></div></div>`).join('')}<button class=opt id=chk>Cevapları kontrol et ✅</button><div id=res></div>`);
app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{if(chk.disabled)return;const k=+b.dataset.k;ch[k]=+b.dataset.j;app.querySelectorAll(`.opt[data-k='${k}']`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
chk.onclick=()=>{chk.disabled=1;let sc=0;p.qs.forEach((q,k)=>{app.querySelectorAll(`.opt[data-k='${k}']`).forEach((x,j)=>{x.classList.remove('sel');if(j==q.a)x.classList.add('ok');else if(j==ch[k])x.classList.add('no')});if(ch[k]==q.a)sc++;document.getElementById('e'+k).innerHTML=`<small>${esc(q.exp)}</small>`});
const r=sc/p.qs.length;say(r>=.6?'Harika okuyorsun! 🎉':'Metni bir daha oku, yapabilirsin! 💪',r>=.6?GOOD[0]:BAD);if(r<.6)hit();
res.innerHTML=`<div class=card><h2>${sc}/${p.qs.length}</h2></div><div class=row><button onclick=rd()>📚 Arşiv</button><button onclick=hub()>Ana Hub</button></div>`;res.scrollIntoView({behavior:'smooth'})}}
hub();
</script></body></html>
